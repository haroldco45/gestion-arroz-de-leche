<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arroz de Leche Marle - Gestión HM</title>
    <style>
        :root {
            --primary: #f8bbd0;
            --dark: #ad1457;
            --success: #25D366;
            --info: #2196F3;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: #fff5f8; color: #333; margin: 0; padding: 10px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* Imagen de cabecera */
        .header-img { width: 100%; max-height: 250px; object-fit: cover; border-radius: 10px; margin-bottom: 15px; display: block; }
        h1 { text-align: center; color: var(--dark); margin: 10px 0; }
        
        /* Formulario */
        .form-group { display: grid; grid-template-columns: 2fr 1.5fr 1fr 1fr 1fr; gap: 8px; margin-bottom: 20px; }
        input, select { padding: 12px; border: 1px solid #ddd; border-radius: 5px; width: 100%; box-sizing: border-box; }
        
        /* Botones Principales */
        button { cursor: pointer; border: none; border-radius: 5px; padding: 10px; font-weight: bold; transition: 0.3s; }
        .btn-add { background-color: var(--dark); color: white; grid-column: span 5; font-size: 1.1em; }
        .btn-add:hover { background-color: #880e4f; }
        
        /* Barra de Herramientas */
        .toolbar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
        .btn-tool { color: white; font-size: 0.9em; display: flex; align-items: center; gap: 5px; }
        .bg-print { background: var(--info); }
        .bg-excel { background: #1D6F42; }
        .bg-backup { background: #607D8B; }
        .bg-me { background: var(--success); }

        /* Tabla */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #eee; padding: 12px; text-align: left; }
        th { background-color: var(--primary); color: var(--dark); }
        .status-pago { color: #2e7d32; font-weight: bold; background: #e8f5e9; padding: 5px; border-radius: 4px; cursor: pointer; }
        .status-debe { color: #c62828; font-weight: bold; background: #ffebee; padding: 5px; border-radius: 4px; cursor: pointer; }

        .credits { margin-top: 30px; text-align: center; font-size: 0.85em; color: #777; border-top: 1px solid #eee; padding-top: 15px; }
        
        @media print { .no-print { display: none; } }
        @media (max-width: 700px) { .form-group { grid-template-columns: 1fr 1fr; } .btn-add { grid-column: span 2; } }
    </style>
</head>
<body>

<div class="container">
    <img src="arrozdelechemarle.PNG" alt="Arroz de Leche Marle" class="header-img" onerror="this.src='https://haroldco45.github.io/arrozdelechemarle/arrozdelechemarle.PNG'">
    
    <h1>🍚 Arroz de Leche Marle</h1>
    <p style="text-align: center; margin-bottom: 20px;">Control de Ventas y Cobranza - <b>Vibras Positivas HM</b></p>

    <div class="no-print">
        <div class="form-group">
            <input type="text" id="cliente" placeholder="Nombre del Cliente">
            <input type="number" id="telefono" placeholder="WhatsApp (Ej: 311...)">
            <select id="producto">
                <option value="Arroz de Leche Tradicional">Tradicional</option>
                <option value="Arroz de Leche con Queso">Con Queso</option>
                <option value="Arroz de Leche Especial">Especial</option>
            </select>
            <input type="number" id="cantidad" placeholder="Cant." min="1" value="1">
            <input type="number" id="precio" placeholder="Precio $" value="12000">
            <button class="btn-add" onclick="agregarRegistro()">🚀 Registrar Pedido</button>
        </div>

        <div class="toolbar">
            <button class="btn-tool bg-print" onclick="window.print()">🖨️ Imprimir</button>
            <button class="btn-tool bg-excel" onclick="exportarExcel()">📊 Excel</button>
            <button class="btn-tool bg-backup" onclick="backup()">💾 Backup</button>
            <button class="btn-tool bg-backup" onclick="restaurar()">🔄 Restaurar</button>
            <button class="btn-tool bg-me" onclick="enviarAMi()">📲 Resumen a Mi</button>
        </div>
    </div>

    <div class="table-container">
        <table id="tablaVentas">
            <thead>
                <tr>
                    <th>Cliente</th>
                    <th>WhatsApp</th>
                    <th>Pedido</th>
                    <th>Total $</th>
                    <th>Estado</th>
                    <th class="no-print">Acciones</th>
                </tr>
            </thead>
            <tbody id="listaVentas"></tbody>
        </table>
    </div>

    <div class="credits">
        <p>&copy; 2026 Todos los derechos reservados a <strong>Vibras Positivas HM</strong></p>
    </div>
</div>

<script>
    let ventas = JSON.parse(localStorage.getItem('ventas_marle_v3')) || [];
    const MI_CEL = "573117700431";

    function guardar() {
        localStorage.setItem('ventas_marle_v3', JSON.stringify(ventas));
        renderizar();
    }

    function agregarRegistro() {
        const cliente = document.getElementById('cliente').value;
        const tel = document.getElementById('telefono').value;
        const producto = document.getElementById('producto').value;
        const cant = document.getElementById('cantidad').value;
        const precio = document.getElementById('precio').value;

        if(!cliente || !precio || !tel) return alert("Por favor llena Nombre, Teléfono y Precio");

        ventas.push({
            id: Date.now(),
            nombre: cliente,
            tel: tel.startsWith('57') ? tel : '57' + tel,
            producto: producto,
            cant: cant,
            total: parseFloat(cant) * parseFloat(precio),
            estado: 'debe'
        });
        
        // Limpiar campos (mantiene el precio por defecto para el siguiente)
        document.getElementById('cliente').value = '';
        document.getElementById('telefono').value = '';
        document.getElementById('cantidad').value = '1';
        guardar();
    }

    function cambiarEstado(id) {
        ventas = ventas.map(v => {
            if(v.id === id) v.estado = v.estado === 'debe' ? 'pagado' : 'debe';
            return v;
        });
        guardar();
    }

    function eliminar(id) {
        if(confirm("¿Eliminar registro?")) {
            ventas = ventas.filter(v => v.id !== id);
            guardar();
        }
    }

    function cobrarCliente(v) {
        const msg = `Hola ${v.nombre}, te saludamos de Arroz de Leche Marle 🍚. Te recordamos tu pedido de ${v.cant} ${v.producto} por un total de $${v.total.toLocaleString()}. ¿Deseas pagarlo ahora? ¡Gracias!`;
        window.open(`https://api.whatsapp.com/send?phone=${v.tel}&text=${encodeURIComponent(msg)}`, '_blank');
    }

    function enviarAMi() {
        let deudores = ventas.filter(v => v.estado === 'debe');
        let total = deudores.reduce((acc, v) => acc + v.total, 0);
        const msg = `Vibras Positivas HM - Reporte:\nTienes ${deudores.length} deudores.\nTotal por cobrar: $${total.toLocaleString()}`;
        window.open(`https://api.whatsapp.com/send?phone=${MI_CEL}&text=${encodeURIComponent(msg)}`, '_blank');
    }

    function exportarExcel() {
        let table = document.getElementById("tablaVentas");
        window.open('data:application/vnd.ms-excel,' + encodeURIComponent(table.outerHTML));
    }

    function backup() {
        navigator.clipboard.writeText(JSON.stringify(ventas));
        alert("Copia de seguridad copiada. Guárdala en un mensaje o nota.");
    }

    function restaurar() {
        const data = prompt("Pega el código de respaldo aquí:");
        if(data) { try { ventas = JSON.parse(data); guardar(); } catch(e) { alert("Datos no válidos"); } }
    }

    function renderizar() {
        const lista = document.getElementById('listaVentas');
        lista.innerHTML = '';
        ventas.forEach(v => {
            lista.innerHTML += `
                <tr>
                    <td>${v.nombre}</td>
                    <td>${v.tel}</td>
                    <td>${v.producto} (x${v.cant})</td>
                    <td><b>$${v.total.toLocaleString()}</b></td>
                    <td>
                        <span class="${v.estado === 'pagado' ? 'status-pago' : 'status-debe'}" onclick="cambiarEstado(${v.id})">
                            ${v.estado.toUpperCase()}
                        </span>
                    </td>
                    <td class="no-print">
                        <button style="background:#25D366; color:white;" onclick='cobrarCliente(${JSON.stringify(v)})'>💬 Cobrar</button>
                        <button style="background:#ff5252; color:white;" onclick="eliminar(${v.id})">🗑️</button>
                    </td>
                </tr>
            `;
        });
    }
    renderizar();
</script>
</body>
</html>
